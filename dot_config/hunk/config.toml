watch = true
theme = "hoshock-md"
mode = "unified"
line_numbers = true
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
copy_decorations = false
cursor_line = "row"

[extensions]
paths = ["~/Projects/Hoshock-Hunk-Extensions"]

[keybindings]
"hunk.view.openThemeSelector" = false

[themes.hoshock-md]
base = "github-dark-dimmed"
label = "Hoshock Markdown"
selectedHunk = "#2d333a"
