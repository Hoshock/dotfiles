"$schema" = 'https://starship.rs/config-schema.json'

command_timeout = 1000
continuation_prompt = '[❯❯ ](bold fg:blue)'

format = """
${custom.repo_git}\
${custom.repo_nogit}\
$directory\
$git_branch\
$git_status\
${custom.branch_nogit}\
$time\
[ ](fg:color_bg1)\
$line_break$character"""

palette = 'gruvbox_dark'

[palettes.gruvbox_dark]
color_fg0 = '#fbf1c7'
color_bg1 = '#3c3836'
color_bg3 = '#665c54'
color_blue = '#458588'
color_aqua = '#689d6a'
color_green = '#98971a'
color_orange = '#d65d0e'
color_purple = '#b16286'
color_red = '#cc241d'
color_yellow = '#d79921'

# Git repository name (shown only in git repos)
[custom.repo_git]
command = '''
case "$PWD" in
  "$HOME/Projects/"*) printf '%s' "${PWD#$HOME/Projects/}" | cut -d/ -f1 ;;
  *) basename "$(git rev-parse --show-toplevel 2>/dev/null)" ;;
esac
'''
when = "git rev-parse --is-inside-work-tree 2>/dev/null"
format = '[](color_orange)[ 󰊢 $output ](bg:color_orange fg:color_fg0)[](bg:color_yellow fg:color_orange)'

# Orange bar placeholder (non-git only)
[custom.repo_nogit]
command = "echo 1"
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
format = '[](color_orange)[ ](bg:color_orange fg:color_fg0)[](bg:color_yellow fg:color_orange)'

# Blank branch segment (non-git only)
[custom.branch_nogit]
command = "echo 1"
when = "! git rev-parse --is-inside-work-tree 2>/dev/null"
format = "[](fg:color_yellow bg:color_aqua)[ ](bg:color_aqua fg:color_fg0)[](fg:color_aqua bg:color_bg1)"

[directory]
style = "fg:color_fg0 bg:color_yellow"
format = "[ 󰝰 $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:color_aqua"
format = '[](fg:color_yellow bg:color_aqua)[[ $symbol $branch ](fg:color_fg0 bg:color_aqua)]($style)'

[git_status]
style = "bg:color_aqua"
format = '[[($all_status$ahead_behind )](fg:color_fg0 bg:color_aqua)]($style)[](fg:color_aqua bg:color_bg1)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_bg1"
format = '[[  $time ](fg:color_fg0 bg:color_bg1)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯❯❯](bold fg:green)'
error_symbol = '[❯❯❯](bold fg:color_red)'
